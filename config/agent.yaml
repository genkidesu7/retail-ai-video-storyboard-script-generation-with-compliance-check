# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block. That nested shape is invisible to the registry (falls back to
# defaults / KeyErrors).
id: "RET-C2-239"
name: "Retail AI Video Storyboard & Script Generation with Compliance Check"
namespace: "RET"
version: "0.1.0"
enabled: true
category: "Cat 2"
generation_mode: "llm"  # deterministic | llm
industry: "Retail (RET)"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "MultiStepOrchestrator"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
class: "src.graph.graph.RetailVideoStoryboardAgent"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates — declare every secret/extra actually used.
requires:
  secrets:
    - AZURE_OPENAI_API_KEY
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_DEPLOYMENT
  extras: ["openai"]

# Runtime parameters (max_retry, timeout_s, platform_config, ...) live in
# config/config.yaml — loaded separately and passed as Graph(config=...).
