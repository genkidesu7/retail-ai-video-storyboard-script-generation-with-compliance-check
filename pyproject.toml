[project]
name = "RET-C2-239"
version = "0.1.0"
description = "Multi-step AI agent that transforms retail product briefs into compliance-checked storyboards and video scripts for AI-generated video campaigns"
requires-python = ">=3.11"
dependencies = [
    "agenticstar-agentcore[openai,marketplace]==1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.uv]
# agenticstar-agentcore's published package-index metadata can pin a
# langchain-core version incompatible with what its own "openai" extra
# (-> langchain-openai) requires — confirmed root cause of a
# registry-install-only failure. Force the
# SDK-compatible version the agentcore release actually ships with; re-verify
# this pin if the agenticstar-agentcore version above ever changes.
override-dependencies = [
    "langchain-core==1.5.4",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# framework/shared (agenticstar-agentcore) are provided by CI without a
# py.typed marker in this repo's dev arm, so every base class we extend
# (FunctionNode, GraphNode, BaseGraph, AgentBaseGraph, AgentState) resolves
# to Any. disallow_subclassing_any covers exactly this case; everything
# else stays under strict.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "yaml"]
ignore_missing_imports = true
